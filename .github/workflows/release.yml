name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Release-please makes every call with RELEASE_PLEASE_TOKEN, so GITHUB_TOKEN needs nothing.
    permissions:
      contents: read
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # An empty secret would replace the action's default token and fail with a vague error.
      - name: Check RELEASE_PLEASE_TOKEN is set
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Set the RELEASE_PLEASE_TOKEN secret; see Releases in README.md"
            exit 1
          fi
      # A token of its own, so the release PR runs CI like any other PR and Actions needs
      # no right to create or approve pull requests. Pinned to a commit, because the step
      # sees a long-lived token.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  installer:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      # Attach to the release release-please just created; electron-builder skips
      # publishing to a release that is already published.
      - run: gh release upload "$TAG" dist/*.exe --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
