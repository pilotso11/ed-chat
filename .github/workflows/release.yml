name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Release-please makes every call with the app's token, so GITHUB_TOKEN needs nothing.
    permissions:
      contents: read
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # An empty secret would fail later with a vague error.
      - name: Check RELEASE_APP_KEY is set
        env:
          APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
        run: |
          if [ -z "$APP_KEY" ]; then
            echo "::error::Set the RELEASE_APP_KEY secret; see Releases in README.md"
            exit 1
          fi
      # Release-please acts as a GitHub App: its release PR runs CI like any other PR,
      # and GitHub signs the commits it makes, which the signed-commits rule needs.
      # Pinned to commits, because these steps see the app's key and token.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The app's Client ID, which is not secret.
          client-id: Iv23liNcPQxLPARFdHQN
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}

  installer:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      # Attach to the release release-please just created; electron-builder skips
      # publishing to a release that is already published.
      - run: gh release upload "$TAG" dist/*.exe dist/*.appx --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
      # The README's coverage badge reads coverage.json from the latest release, so nothing is
      # committed or published anywhere else. After the installer, and allowed to fail: a test
      # that fails here leaves the badge at the last release's number, never a release without
      # its installer. CI ran the same tests on this commit before it merged.
      - name: Coverage badge
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          npm run coverage
          npx tsx scripts/coverage-badge.ts
          gh release upload "$TAG" coverage/coverage.json --clobber
