name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, format and the unit tests with coverage; fails below the src/core minimums.
      - run: npm run check
      - name: Coverage summary
        # Also after a test failure, but not when the tests never ran.
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        shell: bash
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| | % | covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
      - run: npm run dist
      # The built app in Electron (npm run dist built it).
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: ed-chat-installer
          path: dist/*.exe

  ci-ok:
    # Single stable check name for branch protection.
    name: ci-ok
    needs: [check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.check.result }}" = "success"
