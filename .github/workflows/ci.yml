name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ed-overlay-installer
          path: dist/*.exe

  ci-ok:
    # Single stable check name for branch protection.
    name: ci-ok
    needs: [check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.check.result }}" = "success"
