<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- dark inside the hull and pods only; the rest is transparent -->
  <path d="M512 150 L866 700 L158 700 Z" fill="#11141b"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="40" stroke-linejoin="round" stroke-linecap="round">
    <!-- hull: a broad wedge seen from above, nose up -->
    <path d="M512 150 L866 700 L640 700 M384 700 L158 700 L512 150"/>
    <!-- twin engine pods at the rear -->
    <rect x="392" y="560" width="88" height="210" rx="22" fill="#11141b"/>
    <rect x="544" y="560" width="88" height="210" rx="22" fill="#11141b"/>
    <!-- canopy -->
    <path d="M512 300 L552 410 L512 470 L472 410 Z"/>
  </g>
  <g fill="none" stroke="#ff7a1a" stroke-width="34" stroke-linecap="round" opacity="0.5">
    <!-- engine wash -->
    <path d="M436 830 L436 910"/>
    <path d="M588 830 L588 910"/>
  </g>
</svg>
